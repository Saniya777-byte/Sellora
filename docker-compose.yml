version: "3.8"

services:
  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://server:5000

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=your_mongo_uri
      - JWT_SECRET=your_secret
