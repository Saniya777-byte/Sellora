name: Sellora CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend – Lint, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint – fail on warnings)
        run: npm run lint

      - name: Run unit + integration tests (Vitest)
        run: npm test
        env:
          NODE_ENV: test

      - name: Build production bundle (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sellora-dist-${{ github.sha }}
          path: client/dist/
          retention-days: 14

  # ── Notify ──────────────────────────────────────────────────────────────────
  notify:
    name: CI Status
    needs: [frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          FRONTEND="${{ needs.frontend.result }}"
          echo "Frontend: $FRONTEND"
          if [ "$FRONTEND" = "success" ]; then
            echo "All checks passed."
          else
            echo "One or more checks failed."
            exit 1
          fi

  # ── Deploy to EC2 (main branch only) ────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: [frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.frontend.result == 'success'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sellora-dist-${{ github.sha }}
          path: client/dist

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            echo "Starting Sellora deployment..."
            cd /var/www/sellora

            # Backup current dist (idempotent)
            if [ -d dist ]; then
              rm -rf dist.bak
              mv dist dist.bak
            fi

            echo "Deployment placeholder executed successfully."
            echo "In production: rsync or S3 sync would place files here."

      - name: Upload dist to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: client/dist/*
          target: /var/www/sellora/dist
          strip_components: 2